<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>學姊問答</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" />
<!-- Without this the browser asks for /favicon.ico on every load and gets
     a 404. There is no icon to serve, so say so rather than let it ask. -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar-history">
      <button type="button" id="newChatBtn" class="btn btn-primary btn-block blueprint">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>＋ 開始新對話
      </button>

      <div class="history-section">
        <div class="section-label">對話紀錄</div>
        <ol class="history-list" id="historyList">
          <li class="history-empty" id="historyEmpty">還沒有紀錄</li>
        </ol>
      </div>
    </aside>

    <aside class="sidebar-avatar">
      <div class="avatar-frame blueprint">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <canvas id="avatarCanvas" class="avatar-canvas"></canvas>
        <!-- Two elements, used alternately: an element can only buffer one
             source, so the next clause needs somewhere of its own to arrive
             into while this one is still playing. See public/src/speech.js. -->
        <audio id="avatarAudio" playsinline></audio>
        <audio id="avatarAudioNext" playsinline></audio>
        <div class="connect-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <p id="loadingStatus">學姊準備中…</p>
        </div>
        <div class="speaking-badge blueprint" id="speakingBadge" hidden>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <span class="speaking-dots"><span></span><span></span><span></span></span>
          學姊說話中
        </div>
      </div>

      <div class="avatar-meta">
        <div class="avatar-title">學姊</div>
        <div class="avatar-sub" id="avatarSub">全學年第一名</div>
      </div>
      <span class="tag tag-outline" id="statusTag">啟動中</span>

      <!-- Set once and then left alone, so they stay out of the way until
           asked for. The defaults are what a student should get without
           touching anything. -->
      <button type="button" class="settings-toggle" id="settingsBtn"
              aria-expanded="false" aria-controls="avatarControls">設定</button>
      <div class="avatar-controls" id="avatarControls" hidden>
        <label for="rateRange">語速<span class="control-val" id="rateVal">1.0</span></label>
        <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" />
        <label for="volumeRange">音量<span class="control-val" id="volumeVal">1.0</span></label>
        <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="1" />
        <label for="voiceSelect">聲線</label>
        <select id="voiceSelect"></select>
        <label for="toneSelect">語氣</label>
        <select id="toneSelect"></select>
        <button type="button" class="control-btn" id="previewBtn">試聽這個聲音</button>
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-row ai">
          <div class="chat-label">學姊</div>
          <div class="chat-bubble">你好呀！我是學姊。不管是功課、考試還是社團，有什麼問題都可以問我喔。</div>
        </div>
      </div>

      <form id="askForm" class="chat-input-bar">
        <textarea
          id="questionInput"
          class="input"
          rows="1"
          maxlength="2000"
          placeholder="輸入你的問題…"
        ></textarea>
        <button type="submit" id="askBtn" class="btn btn-primary btn-icon blueprint" aria-label="送出" disabled>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        </button>
      </form>
      <div class="hint-row">
        <p class="hint" id="hint">正在載入學姊…</p>
      </div>
    </main>
  </div>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
