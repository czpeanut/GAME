<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>想問就問 - 對話練習</title>
    <!-- Inline so the page makes no extra requests at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23080a14'/><path d='M3 3h10v7H7l-2.5 2.5V10H3z' fill='%237fd4ff'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070e;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        display: block;
        background: #080a14;
        box-shadow: 0 0 0 1px #1d2745, 0 20px 70px rgba(0, 0, 0, 0.75);
        touch-action: none;
        cursor: pointer;
      }
      #hint {
        position: fixed;
        bottom: 8px;
        left: 0;
        right: 0;
        text-align: center;
        color: #3d4a6b;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="540" height="960"></canvas>
    <div id="hint">
      點擊畫面推進對話與選擇 &nbsp;·&nbsp; ENTER/SPACE 確認 &nbsp;·&nbsp; ↑/↓
      切換選項 &nbsp;·&nbsp; M 靜音
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
