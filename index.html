<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hollow Runner - 2D Action Shooter</title>
    <!-- Inline so the page makes no extra requests at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23080a14'/><rect x='5' y='3' width='6' height='10' fill='%23e8f1ff'/><rect x='6' y='6' width='4' height='4' fill='%237fd4ff'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070e;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        display: block;
        /* Keep the low-res render sharp when it is scaled up. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #080a14;
        box-shadow: 0 0 0 1px #1d2745, 0 20px 70px rgba(0, 0, 0, 0.75);
        touch-action: none;
      }
      #hint {
        position: fixed;
        bottom: 8px;
        left: 0;
        right: 0;
        text-align: center;
        color: #3d4a6b;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="640" height="360"></canvas>
    <div id="hint">
      A/D move &nbsp;·&nbsp; SPACE jump &nbsp;·&nbsp; J fire &nbsp;·&nbsp; SHIFT
      dash &nbsp;·&nbsp; ESC pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; F3 debug
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
